{% extends "base_bs.html" %}
{% block body %}
{% include "partials/nav.html" %}
<main class="kc-page">
  {% block content %}{% endblock %}
</main>

<div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
  <div id="kc-toast" class="toast align-items-center text-bg-dark border-0" role="status" aria-live="polite" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body d-flex align-items-center gap-2"><i class="bi bi-check-circle"></i><span></span></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/kc.js') }}"></script>
{% block page_scripts %}{% endblock %}
{% endblock %}
