<nav class="d-flex gap-3 align-items-center p-3" aria-label="Register pages">{% if page>1 %}<a href="{{ url_for(request.endpoint, page=page-1, q=search, active=active|default(''), tab=tab|default('library')) }}">Previous</a>{% endif %}<span class="small text-secondary">Page {{ page }} · Up to 50 records per page</span>{% if more %}<a href="{{ url_for(request.endpoint, page=page+1, q=search, active=active|default(''), tab=tab|default('library')) }}">Next</a>{% endif %}</nav>
