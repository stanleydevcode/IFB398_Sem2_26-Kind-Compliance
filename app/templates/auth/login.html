{% extends "base.html" %}
{% block title %}Login | Kind Compliance{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <h1 class="h3">Kind Compliance</h1>
      <p class="text-secondary">Sign in to continue.</p>
    </div>

    <form method="post" class="card card-body shadow-sm">
      <label class="form-label">Email</label>
      <input class="form-control mb-3" name="email" type="email" required>

      <label class="form-label">Password</label>
      <input class="form-control mb-3" name="password" type="password" required>

      <button class="btn btn-primary">Sign in</button>
    </form>

    <p class="text-center mt-3">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}">Register</a>
    </p>
  </div>
</div>
{% endblock %}
